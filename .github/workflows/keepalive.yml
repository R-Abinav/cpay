# Render free services sleep after 15 min idle; ping each health endpoint every 10 min.
# Base URLs come from repository variables (Settings > Secrets and variables > Actions > Variables), e.g.
# CPAY_WEB_URL=https://cpay-web.onrender.com. Unset ones are skipped. No secrets are used.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CPAY_WEB_URL: ${{ vars.CPAY_WEB_URL }}
      CPAY_HUB_URL: ${{ vars.CPAY_HUB_URL }}
      CPAY_RELAY_URL: ${{ vars.CPAY_RELAY_URL }}
      CPAY_ISSUER_URL: ${{ vars.CPAY_ISSUER_URL }}
    steps:
      - name: Ping health endpoints
        run: |
          status=0
          ping() {
            base="${1%/}"
            path="$2"
            if [ -z "$base" ]; then
              echo "skip (unset)"
              return 0
            fi
            curl -fsS --max-time 20 -o /dev/null "$base$path" && echo "ok $path" || { echo "failed $path"; status=1; }
          }
          ping "$CPAY_WEB_URL" /api/status
          ping "$CPAY_HUB_URL" /health
          ping "$CPAY_RELAY_URL" /health
          ping "$CPAY_ISSUER_URL" /health
          exit $status
