; CPay glasses-kit firmware (PlatformIO, Arduino core).
;
; Two boards, four environments:
;   ESP32-C3 SuperMini (OLED + 3 buttons):  c3-i2c-scan (diagnostic) -> c3-display (real firmware)
;   ESP32-CAM (OV2640):                     cam-probe   (diagnostic) -> cam        (real firmware)
;
; Flash the diagnostic env first, read the serial monitor, put the confirmed pins in
; WIRING.md and (if they differ from the defaults) in the build_flags below.
; See ../README.md for the full order of steps.

[platformio]
default_envs = c3-display, cam

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -DCPAY_FW_VERSION=\"0.1.0\"

; ---------------------------------------------------------------- ESP32-C3 SuperMini
[c3]
board = esp32-c3-devkitm-1
; native USB (USB-Serial-JTAG): Serial goes over the USB-C port
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; ---- C3 pins (UNCONFIRMED; see WIRING.md). Override here once the i2c scan says otherwise.
  ; -DPIN_OLED_SDA=8
  ; -DPIN_OLED_SCL=9
  ; -DOLED_I2C_ADDR=0x3C
  ; -DOLED_SH1106=1          ; uncomment if the display is an SH1106 (picture shifted / garbage column)
  ; -DPIN_BTN_CAPTURE=5
  ; -DPIN_BTN_CONFIRM=6
  ; -DPIN_BTN_CANCEL=7
  ; -DC3_WIFI_LOW_TX_POWER=0 ; set to 0 to disable the SuperMini antenna workaround

[env:c3-display]
extends = c3
build_src_filter = +<c3_display/>
lib_deps =
  links2004/WebSockets@^2.6.1
  olikraus/U8g2@^2.36.2
  bblanchon/ArduinoJson@^7.2.1

[env:c3-i2c-scan]
extends = c3
build_src_filter = +<c3_i2c_scan/>
lib_deps =
  olikraus/U8g2@^2.36.2

; ---------------------------------------------------------------- ESP32-CAM
[cam]
board = esp32cam
board_build.partitions = huge_app.csv
; many USB-C ESP32-CAM boards wire DTR/RTS to EN/IO0: keep them released so the
; serial monitor doesn't hold the chip in reset / download mode
monitor_rts = 0
monitor_dtr = 0
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; ---- camera: AI-Thinker map CONFIRMED by cam-probe (6 Nov). Sensor is a GC2145 (no hardware JPEG).
  -DCAM_MAP_INDEX=0
  -DCAM_SENSOR_NO_JPEG=1
  ; -DCAM_VFLIP=1
  ; -DCAM_HMIRROR=1
  ; -DCAM_DISABLE_BROWNOUT=1 ; last resort if the board resets when Wi-Fi starts; fix power first

[env:cam]
extends = cam
build_src_filter = +<cam/>
lib_deps =
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.1

[env:cam-probe]
extends = cam
build_src_filter = +<cam_probe/>

; ---------------------------------------------------------------- Display DevKit (ESP32-WROOM-32, CP2102)
; Replaces the ESP32-C3 (its USB never enumerated). OLED on SDA=21 / SCL=22.
[devkit]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DPIN_OLED_SDA=21
  -DPIN_OLED_SCL=22

[env:devkit-oled-test]
extends = devkit
build_src_filter = +<devkit_oled_test/>
lib_deps =
  olikraus/U8g2@^2.36.2
