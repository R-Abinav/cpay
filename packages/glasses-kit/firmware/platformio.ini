; CPay glasses-kit firmware (PlatformIO, Arduino core).
;
; One board: the ESP32-CAM (AI-Thinker map, GC2145 sensor) is the whole glasses unit (camera + OLED).
;   cam               production firmware: Wi-Fi portal, hub auth, OLED, QVGA JPEG stream
;   cam-local         same, pointed at a hub on your laptop (ws://, no TLS)
;   cam-probe         diagnostic: finds the camera pin map + sensor
;   devkit-oled-test  diagnostic: OLED on a spare DevKit (SDA 21 / SCL 22)
; See ../README.md (plug and play) and ../WIRING.md.

[platformio]
default_envs = cam

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_flags =
  -Wall
  -DCPAY_FW_VERSION=\"0.3.0\"

; ---------------------------------------------------------------- ESP32-CAM
[cam]
board = esp32cam
board_build.partitions = huge_app.csv
; the DevKit used as USB-serial wires DTR/RTS to nothing useful: keep them released so the
; serial monitor doesn't hold the chip in reset / download mode
monitor_rts = 0
monitor_dtr = 0
build_flags =
  ${env.build_flags}
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  ; ---- camera: AI-Thinker map CONFIRMED by cam-probe (6 Nov). Sensor is a GC2145 (no hardware JPEG).
  -DCAM_MAP_INDEX=0
  -DCAM_SENSOR_NO_JPEG=1
  ; -DCAM_VFLIP=1
  ; -DCAM_HMIRROR=1
  ; -DCAM_JPEG_QUALITY=70     ; software JPEG, 1-100, HIGHER = better (not the 0-63 OV2640 scale)
  ; -DCAM_DISABLE_BROWNOUT=1 ; last resort if the board resets when Wi-Fi starts; fix power first
  ; ---- OLED (SSD1306 128x64 @ 0x3C) on the SD-card pins; camera SCCB is on I2C port 1, OLED on Wire (port 0)
  -DPIN_OLED_SDA=15
  -DPIN_OLED_SCL=14
  ; -DOLED_SW_I2C=1           ; fallback: bit-banged I2C if the hardware bus ever clashes with the camera

[hub_render]
; The deployed glasses hub. CHANGE HUB_HOST if the Render service URL differs.
build_flags =
  -DHUB_HOST=\"cpay-hub.onrender.com\"
  -DHUB_PORT=443
  -DHUB_TLS=1
  -DHUB_PATH=\"/device\"

[env:cam]
extends = cam
build_src_filter = +<cam/>
build_flags =
  ${cam.build_flags}
  ${hub_render.build_flags}
lib_deps =
  links2004/WebSockets@^2.6.1
  bblanchon/ArduinoJson@^7.2.1
  olikraus/U8g2@^2.36.2
  tzapu/WiFiManager@^2.0.17

; Local hub on your laptop (`pnpm hub`, ws://<laptop-ip>:8790/device). Build with:
;   CPAY_HUB_HOST=192.168.1.23 pio run -e cam-local
[env:cam-local]
extends = env:cam
build_flags =
  ${cam.build_flags}
  -DHUB_HOST=\"${sysenv.CPAY_HUB_HOST}\"
  -DHUB_PORT=8790
  -DHUB_TLS=0
  -DHUB_PATH=\"/device\"

[env:cam-probe]
extends = cam
build_src_filter = +<cam_probe/>

; ---------------------------------------------------------------- Display DevKit (ESP32-WROOM-32, CP2102)
; Spare board used to confirm the OLED. OLED on SDA=21 / SCL=22.
[devkit]
board = esp32dev
build_flags =
  ${env.build_flags}
  -DPIN_OLED_SDA=21
  -DPIN_OLED_SCL=22

[env:devkit-oled-test]
extends = devkit
build_src_filter = +<devkit_oled_test/>
lib_deps =
  olikraus/U8g2@^2.36.2
