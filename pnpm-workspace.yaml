packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  # pulled in by @0gfoundation/0g-storage-ts-sdk (websocket/ws). Optional native
  # speedups with JS fallbacks, and an es5-ext postinstall notice: none needed.
  bufferutil: false
  utf-8-validate: false
  es5-ext: false
  # protobufjs postinstall only prints a version notice; not needed.
  protobufjs: false
  # @cpay/database: Prisma engines + client generation (else `pnpm install` fails on Render).
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
